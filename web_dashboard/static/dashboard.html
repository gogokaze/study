<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YFL Robotics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --gray: #6e7681;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; color: var(--accent); }

    #ws-status {
      margin-left: auto;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #ws-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gray);
      transition: background 0.3s;
    }

    #ws-dot.connected   { background: var(--green); }
    #ws-dot.error       { background: var(--red); }

    main { padding: 24px; }

    h2 { font-size: 14px; font-weight: 600; color: var(--text-dim); text-transform: uppercase;
         letter-spacing: 0.06em; margin-bottom: 14px; }

    /* -------- Device cards -------- */
    #device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }

    .device-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.2s;
    }

    .device-card:hover { border-color: var(--accent); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .card-title { font-weight: 600; font-size: 13px; }
    .card-type  { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-RUNNING  { background: #1a4731; color: var(--green); }
    .badge-IDLE     { background: #1f2935; color: var(--accent); }
    .badge-ERROR    { background: #3d1c1c; color: var(--red); }
    .badge-OFFLINE  { background: #1c1e22; color: var(--gray); }
    .badge-CHARGING { background: #332700; color: var(--yellow); }

    .battery-bar {
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      margin: 10px 0 6px;
      overflow: hidden;
    }

    .battery-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--green);
      transition: width 0.4s ease;
    }

    .battery-fill.warn  { background: var(--yellow); }
    .battery-fill.crit  { background: var(--red); }

    .card-detail { font-size: 11px; color: var(--text-dim); line-height: 1.7; }
    .card-detail span { color: var(--text); }

    /* -------- Chart -------- */
    #chart-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 32px;
    }

    #battery-chart { max-height: 200px; }

    /* -------- Events table -------- */
    #events-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    #events-section h2 { padding: 16px 20px 0; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: rgba(88,166,255,0.05); }

    tbody td {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text);
    }

    tbody tr:last-child td { border-bottom: none; }

    .ts { color: var(--text-dim); font-size: 11px; font-family: monospace; }
  </style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
    <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83
    M2 12h4M18 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
  </svg>
  <h1>YFL Robotics Dashboard</h1>
  <a href="/pcb" style="color:#8b949e; font-size:12px; text-decoration:none;">PCB Design &rarr;</a>
  <div id="ws-status">
    <div id="ws-dot"></div>
    <span id="ws-label">Connecting…</span>
  </div>
</header>

<main>
  <h2>Device Status</h2>
  <div id="device-grid">
    <!-- Cards injected by JS -->
  </div>

  <div id="chart-section">
    <h2 style="margin-bottom:16px">Live Battery Levels (%)</h2>
    <canvas id="battery-chart"></canvas>
  </div>

  <div id="events-section">
    <h2>Recent Telemetry Events</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Device</th>
          <th>Type</th>
          <th>Status</th>
          <th>Battery</th>
          <th>Extra</th>
        </tr>
      </thead>
      <tbody id="events-tbody">
      </tbody>
    </table>
  </div>
</main>

<script>
(function () {
  "use strict";

  // -----------------------------------------------------------------------
  // Config
  // -----------------------------------------------------------------------
  const WS_URL     = `ws://${location.host}/ws/telemetry`;
  const API_DEVICES = "/api/devices";
  const MAX_EVENTS  = 50;
  const MAX_CHART_POINTS = 30;

  // -----------------------------------------------------------------------
  // State
  // -----------------------------------------------------------------------
  const deviceState = {};   // device_id -> latest packet
  const chartData   = {};   // device_id -> array of battery values
  const DEVICE_COLORS = [
    "#58a6ff", "#3fb950", "#d29922", "#f85149", "#a371f7", "#39d353"
  ];
  let colorIndex = 0;

  // -----------------------------------------------------------------------
  // Chart setup
  // -----------------------------------------------------------------------
  const ctx = document.getElementById("battery-chart").getContext("2d");
  const batteryChart = new Chart(ctx, {
    type: "line",
    data: { labels: [], datasets: [] },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      animation: { duration: 300 },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: "#c9d1d9", boxWidth: 12, font: { size: 11 } } },
        tooltip: { backgroundColor: "#161b22", borderColor: "#30363d", borderWidth: 1 }
      },
      scales: {
        x: {
          ticks: { color: "#8b949e", maxTicksLimit: 6, font: { size: 10 } },
          grid: { color: "#21262d" }
        },
        y: {
          min: 0, max: 100,
          ticks: { color: "#8b949e", font: { size: 10 } },
          grid: { color: "#21262d" }
        }
      }
    }
  });

  // -----------------------------------------------------------------------
  // Helper: format timestamp
  // -----------------------------------------------------------------------
  function fmtTs(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString("en-US", { hour12: false });
  }

  // -----------------------------------------------------------------------
  // Device card rendering
  // -----------------------------------------------------------------------
  function ensureCard(deviceId, deviceType) {
    let card = document.getElementById(`card-${CSS.escape(deviceId)}`);
    if (!card) {
      card = document.createElement("div");
      card.className = "device-card";
      card.id = `card-${deviceId}`;
      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-title">${deviceId}</div>
            <div class="card-type">${deviceType}</div>
          </div>
          <span class="badge badge-OFFLINE" id="badge-${deviceId}">OFFLINE</span>
        </div>
        <div class="battery-bar"><div class="battery-fill" id="bfill-${deviceId}" style="width:0%"></div></div>
        <div class="card-detail" id="detail-${deviceId}">—</div>
      `;
      document.getElementById("device-grid").appendChild(card);
    }
    return card;
  }

  function updateCard(packet) {
    ensureCard(packet.device, packet.device_type);

    // Badge
    const badge = document.getElementById(`badge-${packet.device}`);
    if (badge) {
      badge.className = `badge badge-${packet.status}`;
      badge.textContent = packet.status;
    }

    // Battery bar
    const fill = document.getElementById(`bfill-${packet.device}`);
    if (fill && packet.battery != null) {
      const pct = Math.max(0, Math.min(100, packet.battery));
      fill.style.width = pct + "%";
      fill.className = "battery-fill" +
        (pct < 15 ? " crit" : pct < 30 ? " warn" : "");
    }

    // Detail
    const detail = document.getElementById(`detail-${packet.device}`);
    if (detail) {
      const lines = [];
      if (packet.battery != null)
        lines.push(`Battery: <span>${packet.battery.toFixed(1)}%</span>`);
      if (packet.gps)
        lines.push(`GPS: <span>${packet.gps.lat.toFixed(4)}, ${packet.gps.lon.toFixed(4)}</span>`);
      if (packet.imu)
        lines.push(`IMU R/P/Y: <span>${packet.imu.roll.toFixed(1)} / ${packet.imu.pitch.toFixed(1)} / ${packet.imu.yaw.toFixed(1)}</span>`);
      const extraKeys = Object.keys(packet.extra || {}).slice(0, 2);
      for (const k of extraKeys) {
        const v = packet.extra[k];
        const disp = typeof v === "object" ? JSON.stringify(v).slice(0, 30) : String(v);
        lines.push(`${k}: <span>${disp}</span>`);
      }
      detail.innerHTML = lines.join("<br>");
    }
  }

  // -----------------------------------------------------------------------
  // Chart update
  // -----------------------------------------------------------------------
  function updateChart(packet) {
    if (packet.battery == null) return;

    const ts = fmtTs(packet.timestamp);

    // Ensure dataset exists
    let ds = batteryChart.data.datasets.find(d => d.label === packet.device);
    if (!ds) {
      const color = DEVICE_COLORS[colorIndex++ % DEVICE_COLORS.length];
      ds = {
        label: packet.device,
        data: [],
        borderColor: color,
        backgroundColor: color + "22",
        borderWidth: 2,
        pointRadius: 2,
        tension: 0.3,
        fill: false,
      };
      batteryChart.data.datasets.push(ds);
    }

    // Maintain shared X labels based on first device's timestamps
    if (batteryChart.data.datasets[0] === ds) {
      batteryChart.data.labels.push(ts);
      if (batteryChart.data.labels.length > MAX_CHART_POINTS)
        batteryChart.data.labels.shift();
    }

    ds.data.push(packet.battery);
    if (ds.data.length > MAX_CHART_POINTS) ds.data.shift();

    batteryChart.update("none");
  }

  // -----------------------------------------------------------------------
  // Events table
  // -----------------------------------------------------------------------
  function addEvent(packet) {
    const tbody = document.getElementById("events-tbody");
    const tr = document.createElement("tr");

    const extra = packet.extra || {};
    const extraSnippet = Object.entries(extra)
      .slice(0, 2)
      .map(([k, v]) => {
        const val = typeof v === "object" ? JSON.stringify(v).slice(0, 20) : String(v);
        return `${k}:${val}`;
      })
      .join("  ");

    tr.innerHTML = `
      <td class="ts">${fmtTs(packet.timestamp)}</td>
      <td>${packet.device}</td>
      <td style="color:var(--text-dim)">${packet.device_type}</td>
      <td><span class="badge badge-${packet.status}">${packet.status}</span></td>
      <td>${packet.battery != null ? packet.battery.toFixed(1) + "%" : "—"}</td>
      <td style="font-family:monospace;font-size:11px;color:var(--text-dim)">${extraSnippet || "—"}</td>
    `;

    tbody.insertBefore(tr, tbody.firstChild);

    // Trim old rows
    while (tbody.rows.length > MAX_EVENTS) tbody.deleteRow(tbody.rows.length - 1);
  }

  // -----------------------------------------------------------------------
  // Initial device load
  // -----------------------------------------------------------------------
  async function loadDevices() {
    try {
      const res = await fetch(API_DEVICES);
      if (!res.ok) return;
      const data = await res.json();
      for (const [deviceId, info] of Object.entries(data)) {
        ensureCard(deviceId, info.device_type);
        if (info.latest) {
          updateCard({
            device: deviceId,
            device_type: info.device_type,
            battery: info.latest.battery,
            status: info.latest.status || "IDLE",
            timestamp: info.latest.timestamp,
            gps: null,
            imu: null,
            extra: info.latest.extra || {},
          });
        }
      }
    } catch (e) {
      console.warn("Could not load initial devices:", e);
    }
  }

  // -----------------------------------------------------------------------
  // WebSocket
  // -----------------------------------------------------------------------
  const dot   = document.getElementById("ws-dot");
  const label = document.getElementById("ws-label");

  function setWsStatus(state) {
    dot.className = state;
    label.textContent = state === "connected" ? "Live" : state === "error" ? "Disconnected" : "Connecting…";
  }

  function connectWS() {
    const ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      setWsStatus("connected");
      console.info("WebSocket connected");
    };

    ws.onmessage = (event) => {
      let packet;
      try { packet = JSON.parse(event.data); } catch { return; }
      deviceState[packet.device] = packet;
      updateCard(packet);
      updateChart(packet);
      addEvent(packet);
    };

    ws.onerror = () => setWsStatus("error");

    ws.onclose = () => {
      setWsStatus("error");
      console.warn("WebSocket closed — reconnecting in 3s");
      setTimeout(connectWS, 3000);
    };
  }

  // -----------------------------------------------------------------------
  // Bootstrap
  // -----------------------------------------------------------------------
  loadDevices();
  connectWS();

})();
</script>
</body>
</html>
