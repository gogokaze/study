<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YFL Robotics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e0e0e0; }
  header { background: #1a1d27; border-bottom: 2px solid #2a2d3e; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.4rem; font-weight: 700; color: #7eb8f7; }
  #ws-status { margin-left: auto; font-size: 0.8rem; padding: 4px 10px; border-radius: 12px; background: #2a2d3e; }
  #ws-status.connected { background: #1a3a2a; color: #4caf50; }
  #ws-status.disconnected { background: #3a1a1a; color: #ef5350; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7eb8f7; margin: 20px 0 12px; }
  .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .device-card { background: #1a1d27; border: 1px solid #2a2d3e; border-radius: 10px; padding: 16px; transition: border-color 0.2s; }
  .device-card:hover { border-color: #4a6fa5; }
  .device-card .name { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
  .device-card .type { font-size: 0.75rem; color: #888; margin-bottom: 10px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; }
  .badge.RUNNING  { background: #1b3d24; color: #4caf50; }
  .badge.IDLE     { background: #1e2a3a; color: #7eb8f7; }
  .badge.ERROR    { background: #3d1b1b; color: #ef5350; }
  .badge.OFFLINE  { background: #2a2a2a; color: #888; }
  .badge.CHARGING { background: #2e2a10; color: #ffca28; }
  .device-card .battery { margin-top: 10px; font-size: 0.82rem; color: #aaa; }
  .battery-bar { height: 6px; background: #2a2d3e; border-radius: 3px; margin-top: 4px; }
  .battery-fill { height: 100%; border-radius: 3px; background: #4caf50; transition: width 0.4s; }
  .battery-fill.low  { background: #ef5350; }
  .battery-fill.mid  { background: #ffca28; }
  .chart-container { background: #1a1d27; border: 1px solid #2a2d3e; border-radius: 10px; padding: 16px; }
  .events-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .events-table th { background: #1a1d27; color: #7eb8f7; text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2d3e; }
  .events-table td { padding: 6px 10px; border-bottom: 1px solid #1a1d27; }
  .events-table tr:nth-child(even) td { background: #13151f; }
  .events-wrapper { background: #1a1d27; border: 1px solid #2a2d3e; border-radius: 10px; overflow: hidden; max-height: 320px; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7eb8f7" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
  <h1>YFL Robotics Unified Dashboard</h1>
  <span id="ws-status" class="disconnected">● Disconnected</span>
</header>
<main>
  <h2>Device Status</h2>
  <div class="device-grid" id="device-grid"></div>

  <h2>Battery Levels (Live)</h2>
  <div class="chart-container">
    <canvas id="battery-chart" height="90"></canvas>
  </div>

  <h2>Recent Telemetry Events</h2>
  <div class="events-wrapper">
    <table class="events-table">
      <thead><tr><th>Time</th><th>Device</th><th>Type</th><th>Status</th><th>Battery</th></tr></thead>
      <tbody id="events-body"></tbody>
    </table>
  </div>
</main>

<script>
const DEVICE_IDS = ["GT3-001","Z908-001","Go2-001","ARM-001","CNC-001","SUB-001"];
const DEVICE_TYPES = {"GT3":"GT3 Drone","Z908":"Z908 FPV","Go2":"Unitree Go2","RobotArm":"Robot Arm","CNC":"CNC Machine","Submarine":"Lego Submarine"};
const MAX_EVENTS = 50;
const MAX_CHART_POINTS = 30;

const batteryHistory = {};
DEVICE_IDS.forEach(id => { batteryHistory[id] = []; });

const COLORS = ["#7eb8f7","#4caf50","#ffca28","#ef5350","#ab47bc","#26c6da"];

const chart = new Chart(document.getElementById("battery-chart"), {
  type: "line",
  data: {
    labels: [],
    datasets: DEVICE_IDS.map((id, i) => ({
      label: id,
      data: [],
      borderColor: COLORS[i],
      backgroundColor: COLORS[i] + "22",
      tension: 0.4,
      pointRadius: 2,
      fill: false,
    }))
  },
  options: {
    animation: false,
    scales: {
      y: { min: 0, max: 100, grid: { color: "#2a2d3e" }, ticks: { color: "#888" } },
      x: { grid: { color: "#2a2d3e" }, ticks: { color: "#888", maxTicksLimit: 10 } }
    },
    plugins: { legend: { labels: { color: "#aaa", boxWidth: 12 } } }
  }
});

function buildCards() {
  const grid = document.getElementById("device-grid");
  DEVICE_IDS.forEach(id => {
    const el = document.createElement("div");
    el.className = "device-card";
    el.id = "card-" + id;
    el.innerHTML = `
      <div class="name">${id}</div>
      <div class="type" id="type-${id}">—</div>
      <span class="badge OFFLINE" id="badge-${id}">OFFLINE</span>
      <div class="battery">Battery: <span id="bat-${id}">—</span>%
        <div class="battery-bar"><div class="battery-fill" id="batbar-${id}" style="width:0%"></div></div>
      </div>`;
    grid.appendChild(el);
  });
}

function updateCard(pkt) {
  const id = pkt.device;
  const badge = document.getElementById("badge-" + id);
  const batTxt = document.getElementById("bat-" + id);
  const batBar = document.getElementById("batbar-" + id);
  const typeEl = document.getElementById("type-" + id);
  if (!badge) return;
  badge.textContent = pkt.status;
  badge.className = "badge " + pkt.status;
  typeEl.textContent = DEVICE_TYPES[pkt.device_type] || pkt.device_type;
  if (pkt.battery != null) {
    batTxt.textContent = pkt.battery.toFixed(1);
    const pct = Math.max(0, Math.min(100, pkt.battery));
    batBar.style.width = pct + "%";
    batBar.className = "battery-fill" + (pct < 20 ? " low" : pct < 50 ? " mid" : "");
  }
}

function updateChart(pkt) {
  const idx = DEVICE_IDS.indexOf(pkt.device);
  if (idx === -1 || pkt.battery == null) return;
  chart.data.datasets[idx].data.push(pkt.battery);
  if (chart.data.datasets[idx].data.length > MAX_CHART_POINTS)
    chart.data.datasets[idx].data.shift();
  if (idx === 0) {
    const t = new Date(pkt.timestamp * 1000);
    chart.data.labels.push(t.toLocaleTimeString());
    if (chart.data.labels.length > MAX_CHART_POINTS) chart.data.labels.shift();
  }
  chart.update();
}

function addEvent(pkt) {
  const tbody = document.getElementById("events-body");
  const tr = document.createElement("tr");
  const t = new Date(pkt.timestamp * 1000).toLocaleTimeString();
  tr.innerHTML = `<td>${t}</td><td>${pkt.device}</td><td>${pkt.device_type}</td>
    <td><span class="badge ${pkt.status}">${pkt.status}</span></td>
    <td>${pkt.battery != null ? pkt.battery.toFixed(1) + "%" : "—"}</td>`;
  tbody.prepend(tr);
  while (tbody.rows.length > MAX_EVENTS) tbody.deleteRow(tbody.rows.length - 1);
}

function connectWS() {
  const wsEl = document.getElementById("ws-status");
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/telemetry`);

  ws.onopen = () => {
    wsEl.textContent = "● Connected";
    wsEl.className = "connected";
  };
  ws.onclose = () => {
    wsEl.textContent = "● Disconnected";
    wsEl.className = "disconnected";
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    try {
      const pkt = JSON.parse(ev.data);
      updateCard(pkt);
      updateChart(pkt);
      addEvent(pkt);
    } catch (e) { /* ignore malformed */ }
  };
}

buildCards();
fetch("/api/devices").then(r => r.json()).then(data => {
  Object.values(data).forEach(dev => {
    if (dev.latest) {
      updateCard({
        device: dev.device_id,
        device_type: dev.device_type,
        battery: dev.latest.battery,
        status: dev.latest.status,
        timestamp: dev.latest.timestamp,
      });
    }
  });
});
connectWS();
</script>
</body>
</html>
