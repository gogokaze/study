<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoJokaze MK.1 — PCB Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --gray: #6e7681;
      --copper-top: #d4915a;
      --copper-bottom: #7ec9d6;
      --gnd: #2f6f4f;
      --pwr: #6f4f2f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; color: var(--accent); }
    header .sub { color: var(--text-dim); font-size: 12px; }
    header a { color: var(--text-dim); font-size: 12px; margin-left: auto; text-decoration: none; }
    header a:hover { color: var(--accent); }

    h2 { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase;
         letter-spacing: 0.06em; margin-bottom: 10px; }

    main {
      display: grid;
      grid-template-columns: 220px 1fr 300px;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .layer-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
      cursor: pointer;
    }
    .layer-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    .view-toggle { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }

    #canvas-wrap {
      display: flex;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
    }

    canvas { background: #05070a; border-radius: 4px; cursor: grab; }
    canvas.dragging { cursor: grabbing; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table th, table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    table th { color: var(--text-dim); font-weight: 500; }

    #drc-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    #drc-status.pass { background: rgba(63,185,80,0.15); color: var(--green); }
    #drc-status.fail { background: rgba(248,81,73,0.15); color: var(--red); }

    .violation {
      border-left: 3px solid var(--red);
      background: rgba(248,81,73,0.08);
      padding: 6px 8px;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .violation.warning { border-left-color: var(--yellow); background: rgba(210,153,34,0.08); }
    .violation .rule { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }

    .section { margin-bottom: 20px; }
    .hint { color: var(--text-dim); font-size: 11px; margin-top: 8px; line-height: 1.5; }
    button.reset-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    button.reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>GoJokaze MK.1</h1>
    <span class="sub">Web PCB Design — 36×36mm 4-Layer Flight Controller</span>
    <a href="/">&larr; Telemetry Dashboard</a>
  </header>

  <main>
    <!-- Left: layers + view options -->
    <div class="panel">
      <div class="section">
        <h2>Layers</h2>
        <label class="layer-toggle"><input type="checkbox" data-layer="L1 TOP" checked>
          <span class="layer-swatch" style="background:var(--copper-top)"></span>L1 TOP</label>
        <label class="layer-toggle"><input type="checkbox" data-layer="L2 GND" checked>
          <span class="layer-swatch" style="background:var(--gnd)"></span>L2 GND</label>
        <label class="layer-toggle"><input type="checkbox" data-layer="L3 POWER" checked>
          <span class="layer-swatch" style="background:var(--pwr)"></span>L3 POWER</label>
        <label class="layer-toggle"><input type="checkbox" data-layer="L4 BOTTOM" checked>
          <span class="layer-swatch" style="background:var(--copper-bottom)"></span>L4 BOTTOM</label>
      </div>
      <div class="section">
        <h2>Overlays</h2>
        <label class="view-toggle"><input type="checkbox" id="toggle-ratsnest" checked>Ratsnest</label>
        <label class="view-toggle"><input type="checkbox" id="toggle-courtyard" checked>Courtyard</label>
        <label class="view-toggle"><input type="checkbox" id="toggle-keepout" checked>IMU Keepout</label>
        <label class="view-toggle"><input type="checkbox" id="toggle-drc" checked>DRC Markers</label>
      </div>
      <div class="section">
        <h2>Board</h2>
        <div class="hint" id="board-info">loading…</div>
        <button class="reset-btn" id="reset-btn">Reset Layout</button>
      </div>
      <div class="hint">Drag footprints on the canvas to reposition. DRC re-runs automatically on drop.</div>
    </div>

    <!-- Center: canvas -->
    <div id="canvas-wrap">
      <canvas id="pcb-canvas" width="620" height="620"></canvas>
    </div>

    <!-- Right: DRC + data -->
    <div>
      <div class="panel section">
        <h2>Design Rule Check</h2>
        <div id="drc-status" class="pass">✓ PASS</div>
        <div id="drc-list"></div>
      </div>
      <div class="panel section">
        <h2>Net Classes</h2>
        <table id="netclass-table"><thead><tr><th>Class</th><th>Width</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="panel section">
        <h2>Manufacturing Rules</h2>
        <table id="rules-table"><tbody></tbody></table>
      </div>
    </div>
  </main>

  <script>
    const SCALE = 15; // px per mm
    const PAD = 20;   // canvas padding px
    const canvas = document.getElementById('pcb-canvas');
    const ctx = canvas.getContext('2d');

    let board = null, components = [], ratsnest = [], drc = null, isolation = null;
    let activeLayers = new Set(['L1 TOP', 'L2 GND', 'L3 POWER', 'L4 BOTTOM']);
    let showRatsnest = true, showCourtyard = true, showKeepout = true, showDrc = true;
    let dragging = null, dragOffset = { x: 0, y: 0 };

    function toPx(mm) { return PAD + mm * SCALE; }
    function toMm(px) { return (px - PAD) / SCALE; }

    async function fetchJSON(url, opts) {
      const res = await fetch(url, opts);
      return res.json();
    }

    async function loadStatic() {
      board = await fetchJSON('/api/pcb/board');
      const nc = await fetchJSON('/api/pcb/netclasses');
      const rules = await fetchJSON('/api/pcb/design-rules');
      isolation = rules.isolation;

      canvas.width = toPx(board.width_mm) + PAD;
      canvas.height = toPx(board.height_mm) + PAD;

      document.getElementById('board-info').textContent =
        `${board.width_mm}×${board.height_mm}mm · M3×4 @ ${board.mount_hole_pattern_mm}mm pattern`;

      const ncBody = document.querySelector('#netclass-table tbody');
      ncBody.innerHTML = Object.entries(nc).map(([name, c]) =>
        `<tr><td>${name}</td><td>${c.trace_width_mm}mm</td></tr>`).join('');

      const rulesBody = document.querySelector('#rules-table tbody');
      const m = rules.manufacturing;
      rulesBody.innerHTML = `
        <tr><td>Trace</td><td>${m.min_trace_width_mm}mm</td></tr>
        <tr><td>Spacing</td><td>${m.min_spacing_mm}mm</td></tr>
        <tr><td>Via</td><td>${m.min_via_diameter_mm}mm</td></tr>
        <tr><td>Thickness</td><td>${m.board_thickness_mm}mm</td></tr>
        <tr><td>Finish</td><td>${m.surface_finish}</td></tr>`;
    }

    async function loadDynamic() {
      components = await fetchJSON('/api/pcb/components');
      for (const c of components) {
        const [bx0, by0, bx1, by1] = c.courtyard_bbox;
        c.courtyard_half_w = (bx1 - bx0) / 2;
        c.courtyard_half_h = (by1 - by0) / 2;
      }
      ratsnest = await fetchJSON('/api/pcb/ratsnest');
      drc = await fetchJSON('/api/pcb/drc');
      renderDrcPanel();
      draw();
    }

    function renderDrcPanel() {
      const status = document.getElementById('drc-status');
      const list = document.getElementById('drc-list');
      if (drc.passed) {
        status.className = 'pass';
        status.textContent = '✓ PASS';
      } else {
        status.className = 'fail';
        status.textContent = `✗ ${drc.error_count} error(s), ${drc.warning_count} warning(s)`;
      }
      list.innerHTML = drc.violations.map(v => `
        <div class="violation ${v.severity}">
          <div class="rule">${v.rule}</div>
          ${v.message}
        </div>`).join('') || '<div class="hint">No violations.</div>';
    }

    function componentColor(cat) {
      return {
        mcu: '#58a6ff',
        sensor_imu: '#f85149',
        sensor_mag: '#d29922',
        sensor_baro: '#d29922',
        regulator: '#a371f7',
        connector: '#3fb950',
        passive: '#8b949e',
      }[cat] || '#c9d1d9';
    }

    function violatedRefs() {
      const refs = new Set();
      if (drc) for (const v of drc.violations) for (const r of v.refs) refs.add(r);
      return refs;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // plane fill hint (L2/L3) behind board
      if (activeLayers.has('L2 GND')) {
        ctx.fillStyle = 'rgba(47,111,79,0.15)';
        ctx.fillRect(toPx(0), toPx(0), board.width_mm * SCALE, board.height_mm * SCALE);
      }

      // board outline
      ctx.strokeStyle = '#8b949e';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(toPx(0), toPx(0), board.width_mm * SCALE, board.height_mm * SCALE);

      // mount holes
      ctx.fillStyle = '#30363d';
      ctx.strokeStyle = '#6e7681';
      for (const h of board.mount_holes) {
        ctx.beginPath();
        ctx.arc(toPx(h.x), toPx(h.y), (h.diameter_mm / 2) * SCALE, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // IMU/MAG keepout zones around regulators
      if (showKeepout && isolation) {
        const regs = components.filter(c => c.category === 'regulator');
        for (const r of regs) {
          ctx.beginPath();
          ctx.arc(toPx(r.x_mm), toPx(r.y_mm), isolation.imu_to_regulator_mm * SCALE, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(248,81,73,0.4)';
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // ratsnest
      if (showRatsnest) {
        ctx.strokeStyle = 'rgba(88,166,255,0.55)';
        ctx.lineWidth = 0.75;
        for (const l of ratsnest) {
          ctx.beginPath();
          ctx.moveTo(toPx(l.x1), toPx(l.y1));
          ctx.lineTo(toPx(l.x2), toPx(l.y2));
          ctx.stroke();
        }
      }

      const bad = violatedRefs();

      // components
      for (const c of components) {
        if (!activeLayers.has(c.layer)) continue;
        const bx0 = c.x_mm - c.courtyard_half_w, by0 = c.y_mm - c.courtyard_half_h;
        const bx1 = c.x_mm + c.courtyard_half_w, by1 = c.y_mm + c.courtyard_half_h;

        if (showCourtyard) {
          ctx.strokeStyle = bad.has(c.ref) ? 'rgba(248,81,73,0.8)' : 'rgba(139,148,158,0.4)';
          ctx.setLineDash([3, 2]);
          ctx.lineWidth = 1;
          ctx.strokeRect(toPx(bx0), toPx(by0), (bx1 - bx0) * SCALE, (by1 - by0) * SCALE);
          ctx.setLineDash([]);
        }

        const half_w = c.width_mm / 2, half_h = c.height_mm / 2;
        ctx.fillStyle = componentColor(c.category);
        ctx.fillRect(toPx(c.x_mm - half_w), toPx(c.y_mm - half_h), c.width_mm * SCALE, c.height_mm * SCALE);

        if (bad.has(c.ref) && showDrc) {
          ctx.strokeStyle = '#f85149';
          ctx.lineWidth = 2;
          ctx.strokeRect(toPx(c.x_mm - half_w), toPx(c.y_mm - half_h), c.width_mm * SCALE, c.height_mm * SCALE);
        }

        ctx.fillStyle = '#e6edf3';
        ctx.font = '11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(c.ref, toPx(c.x_mm), toPx(c.y_mm - half_h) - 4);
      }
    }

    function hitTest(mmX, mmY) {
      for (let i = components.length - 1; i >= 0; i--) {
        const c = components[i];
        const bx0 = c.x_mm - c.courtyard_half_w, by0 = c.y_mm - c.courtyard_half_h;
        const bx1 = c.x_mm + c.courtyard_half_w, by1 = c.y_mm + c.courtyard_half_h;
        if (mmX >= bx0 && mmX <= bx1 && mmY >= by0 && mmY <= by1) return c;
      }
      return null;
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mmX = toMm(e.clientX - rect.left);
      const mmY = toMm(e.clientY - rect.top);
      const hit = hitTest(mmX, mmY);
      if (hit) {
        dragging = hit;
        dragOffset = { x: mmX - hit.x_mm, y: mmY - hit.y_mm };
        canvas.classList.add('dragging');
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const rect = canvas.getBoundingClientRect();
      const mmX = toMm(e.clientX - rect.left) - dragOffset.x;
      const mmY = toMm(e.clientY - rect.top) - dragOffset.y;
      dragging.x_mm = Math.max(0, Math.min(board.width_mm, mmX));
      dragging.y_mm = Math.max(0, Math.min(board.height_mm, mmY));
      draw();
    });

    canvas.addEventListener('mouseup', async () => {
      if (!dragging) return;
      canvas.classList.remove('dragging');
      const ref = dragging.ref;
      const x = dragging.x_mm, y = dragging.y_mm;
      dragging = null;
      await fetchJSON(`/api/pcb/components/${ref}/position`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x_mm: x, y_mm: y, rotation_deg: 0 }),
      });
      await loadDynamic();
    });

    document.querySelectorAll('.layer-toggle input').forEach(cb => {
      cb.addEventListener('change', () => {
        const layer = cb.dataset.layer;
        if (cb.checked) activeLayers.add(layer); else activeLayers.delete(layer);
        draw();
      });
    });

    document.getElementById('toggle-ratsnest').addEventListener('change', e => { showRatsnest = e.target.checked; draw(); });
    document.getElementById('toggle-courtyard').addEventListener('change', e => { showCourtyard = e.target.checked; draw(); });
    document.getElementById('toggle-keepout').addEventListener('change', e => { showKeepout = e.target.checked; draw(); });
    document.getElementById('toggle-drc').addEventListener('change', e => { showDrc = e.target.checked; draw(); });

    document.getElementById('reset-btn').addEventListener('click', async () => {
      await fetchJSON('/api/pcb/components/reset', { method: 'POST' });
      await loadDynamic();
    });

    (async function init() {
      await loadStatic();
      await loadDynamic();
    })();
  </script>
</body>
</html>
