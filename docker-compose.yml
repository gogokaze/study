version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: yfl_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  influxdb:
    image: influxdb:2.7
    container_name: yfl_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: yfl
      DOCKER_INFLUXDB_INIT_PASSWORD: yfl_robotics_2025
      DOCKER_INFLUXDB_INIT_ORG: yfl_robotics
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: yfl_super_secret_token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  telemetry-hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: yfl_telemetry_hub
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: yfl_super_secret_token
      INFLUX_ORG: yfl_robotics
      INFLUX_BUCKET: telemetry
      DB_PATH: /data/yfl_telemetry.db
    volumes:
      - hub_data:/data
    restart: unless-stopped

  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: yfl_web_dashboard
    ports:
      - "8080:8080"
    depends_on:
      - telemetry-hub
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DB_PATH: /data/yfl_telemetry.db
    volumes:
      - hub_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  influxdb_data:
  influxdb_config:
  hub_data:
